name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npm run prepare-web
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle

      - name: Set app icon
        run: |
          test -f resources/icon.png && npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2f7d24' --iconBackgroundColorDark '#2f7d24' || echo "Иконка не загружена, используется стандартная"

      - name: Use fixed signing key
        run: |
          test -f debug.keystore || { echo "ОШИБКА: debug.keystore не загружен в корень репозитория"; exit 1; }
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk skin-studio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skin-studio-apk
          path: skin-studio.apk

      - name: Publish release for website download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Skin Studio ${{ github.run_number }}
          files: skin-studio.apk
