name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Отпечаток ключа из debug.keystore в репозитории. Если APK подписан другим ключом, релиз не публикуется.
  EXPECTED_SHA256: "1B:DF:1A:64:6F:28:AA:48:55:42:FE:8A:FD:4F:0E:5F:6E:1E:85:AF:C7:93:15:82:64:1E:42:18:62:F8:D6:97"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use fixed signing key
        run: |
          test -f debug.keystore || { echo "ОШИБКА: debug.keystore не загружен в корень репозитория"; exit 1; }
          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npm run prepare-web
          npx cap add android
          npx cap sync android
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/' android/app/build.gradle
          # Явно подписываем debug-сборку ключом из репозитория (не полагаемся на ~/.android)
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
          grep -n "versionCode\|debug.keystore" android/app/build.gradle

      - name: Set app icon
        run: |
          test -f resources/icon.png && npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2f7d24' --iconBackgroundColorDark '#2f7d24' || echo "Иконка не загружена, используется стандартная"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk skin-studio.apk

      - name: Verify signing key
        run: |
          FP=$(keytool -printcert -jarfile skin-studio.apk | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d '\r')
          echo "APK signer SHA256: $FP"
          echo "Expected:          $EXPECTED_SHA256"
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "ОШИБКА: APK подписан не ключом из репозитория. Релиз не публикуется."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skin-studio-apk
          path: skin-studio.apk

      - name: Publish release for website download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Skin Studio ${{ github.run_number }}
          files: skin-studio.apk
