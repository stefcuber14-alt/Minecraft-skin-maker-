<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skin Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="titlebar">
      <div class="brand">
        <span class="logo"></span>
        Skin Studio
      </div>
      <div class="actions">
        <label class="btn" title="Открыть PNG (Ctrl+O)">
          Открыть
          <input type="file" id="fileInput" accept="image/png" hidden>
        </label>
        <button class="btn primary" id="btnSave" title="Сохранить PNG (Ctrl+S)">Сохранить PNG</button>
      </div>
    </header>

    <div class="main">
      <aside class="tools">
        <div class="group-title">Инструменты</div>
        <button class="tool active" data-tool="pencil">Карандаш <kbd>P</kbd></button>
        <button class="tool" data-tool="eraser">Ластик <kbd>E</kbd></button>
        <button class="tool" data-tool="bucket">Заливка <kbd>F</kbd></button>
        <button class="tool" data-tool="picker">Пипетка <kbd>I</kbd></button>

        <div class="group-title">Правка</div>
        <button class="tool" id="undo" disabled>Отменить <kbd>Ctrl+Z</kbd></button>
        <button class="tool" id="redo" disabled>Повторить <kbd>Ctrl+Y</kbd></button>
        <button class="tool" id="clear">Очистить</button>
      </aside>

      <section class="workspace">
        <div class="canvas-wrap" id="canvasWrap">
          <div class="canvas-box" id="canvasBox">
            <canvas id="skin"></canvas>
            <div class="grid" id="grid"></div>
          </div>
        </div>
        <footer class="statusbar">
          <span id="coords">—</span>
          <span id="size">64 × 64</span>
          <label class="check">
            <input type="checkbox" id="showGrid" checked>
            Сетка
          </label>
          <label class="zoom">
            Масштаб
            <input type="range" id="zoom" min="4" max="20" value="10">
          </label>
        </footer>
      </section>

      <aside class="side">
        <div class="panel">
          <div class="panel-title">Цвет</div>
          <div class="color-row">
            <input type="color" id="color" value="#3b82f6">
            <input type="text" id="hex" maxlength="7" spellcheck="false" value="#3B82F6">
          </div>
          <div class="panel-title sub">Недавние</div>
          <div class="palette" id="recent"></div>
          <div class="panel-title sub">Палитра</div>
          <div class="palette" id="palette"></div>
        </div>

        <div class="panel">
          <div class="panel-title">Предпросмотр</div>
          <label class="check">
            <input type="checkbox" id="showOverlay" checked>
            Второй слой (куртка, шапка)
          </label>
          <div class="preview-stage">
            <canvas id="preview"></canvas>
          </div>
        </div>
      </aside>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
